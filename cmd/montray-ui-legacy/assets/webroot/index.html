<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Montray</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    try {
      if (localStorage.getItem("montray.theme") === "light") {
        document.documentElement.dataset.theme = "light";
      }
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <button id="theme-toggle" type="button"></button>
  <h1>&gt;&lt;&gt; Montray</h1>
  <div><span id="connection-status">Connecting…</span></div>
  <div id="status-summary" hidden>
    <div>
      <button id="server-summary" class="section-summary" type="button" hidden></button>
    </div>
    <div id="servers" hidden></div>
    <div>
      <button id="incident-summary" class="section-summary" type="button"></button>
    </div>
    <div id="incidents"></div>
    <div>
      <button id="snoozed-summary" class="section-summary" type="button"></button>
    </div>
    <div id="snoozed-incidents"></div>
  </div>
  <script src="/time_format.js"></script>
  <script src="/ui_helpers.js"></script>
  <script src="/app.js"></script>
</body>
</html>
