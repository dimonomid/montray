wsClient:
  servers:
    - id: local # Arbitrary but unique ID for this server.
      addr: localhost:41990

    # SSH tunnel example. With addr omitted, Montray UI Legacy allocates an available
    # port on 127.0.0.1 and supervises ssh while WebSocket waits for readiness.
    # - id: remote
    #   tunnel:
    #     ssh:
    #       host: montray.example.com
    #       user: montray
    #       port: 22
    #       remoteServerAddr: 127.0.0.1:41990
    #       extraSshArgs: ["-i", "/etc/montray/remote.key"]

    # Any persistent tunnel command can be supervised instead. The first item
    # is the executable and the rest are passed directly as arguments, without
    # a shell.
    # - id: custom-tunnel
    #   addr: 127.0.0.1:41993
    #   tunnel:
    #     customCommand:
    #       command: ["my-tunnel", "--listen", "127.0.0.1:41993"]
    #       # Omit readinessProbe if the command is ready immediately after it
    #       # starts. Otherwise, WebSocket connections wait for this output.
    #       readinessProbe:
    #         containsOutput: "tunnel ready"
