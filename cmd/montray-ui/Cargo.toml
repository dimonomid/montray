[package]
name = "montray-ui"
version = "1.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
log = "0.4"
notify-rust = "4.18.0"
open = "5"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
slint = { version = "=1.17.1", features = ["unstable-winit-030"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }

[build-dependencies]
slint-build = "=1.17.1"

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
# Optimize distributed binaries for size. Release builds do not need Rust's
# symbol table, and one codegen unit gives LLVM the best opportunity to remove
# duplicate and unreachable code across dependencies.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
