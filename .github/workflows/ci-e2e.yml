name: ci-e2e

on:
  push:

permissions:
  contents: read

jobs:
  montray-packages:
    name: montray packages E2E (Debian and Fedora)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # 0 means full history, not zero commits. Package versions use
          # git describe, so tags must be available.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      - name: Build packages
        run: |
          mkdir -p release
          bash util/build_linux_packages.sh montray-server release
          MONTRAY_UI_LINUX_BUILDER=1 bash util/build_linux_packages.sh montray-ui release

      - name: Run package E2E tests
        run: bash .github/test-linux-packages-e2e.sh release

  montray-ui-legacy:
    name: montray-ui-legacy E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install build and headless-desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev xvfb xauth dbus-x11

      - name: Build binaries and install Montray UI Legacy
        run: |
          make montray-server montray-ui-legacy
          if readelf -lW ./bin/montray-server | grep '[[:space:]]INTERP[[:space:]]' >/dev/null; then
            echo "bin/montray-server is dynamically linked" >&2
            exit 1
          fi
          sudo make install-montray-ui-legacy

      - name: Set up and start Montray Server
        run: |
          sudo ./bin/montray-server setup

          test -x /usr/local/bin/montray-server
          cmp ./bin/montray-server /usr/local/bin/montray-server
          grep -Fq 'ExecStart="/usr/local/bin/montray-server"' /etc/systemd/system/montray-server.service
          sudo systemctl is-enabled --quiet montray-server.service
          sudo systemctl is-active --quiet montray-server.service

      - name: Configure Montray Server for the E2E incident
        run: |
          sudo patch --batch --forward /etc/montray-server.yml .github/e2e/montray-server.yml.patch
          sudo systemctl restart montray-server.service

      - name: Prepare isolated Montray UI Legacy home
        run: mkdir -p "${RUNNER_TEMP}/montray-ui-home"

      - name: Set up Montray UI Legacy
        env:
          HOME: ${{ runner.temp }}/montray-ui-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/montray-ui-home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/montray-ui-home/.local/share
        run: montray-ui-legacy setup

      - name: Verify incident reaches the UI WebSocket
        env:
          HOME: ${{ runner.temp }}/montray-ui-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/montray-ui-home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/montray-ui-home/.local/share
        run: |
          watch_log="${RUNNER_TEMP}/montray-ui-legacy.log"
          setsid dbus-run-session -- xvfb-run -a montray-ui-legacy >"${watch_log}" 2>&1 &
          watch_pid=$!
          cleanup_watch() {
            kill -- "-${watch_pid}" 2>/dev/null || true
            wait "${watch_pid}" 2>/dev/null || true
          }
          trap cleanup_watch EXIT

          # Exercise the same local WebSocket endpoint used by the browser UI.
          if ! node .github/e2e/verify-montray-ui-legacy.mjs; then
            echo "Montray UI Legacy log:"
            cat "${watch_log}"
            echo "Montray Server service log:"
            sudo journalctl --no-pager -u montray-server.service
            exit 1
          fi

      - name: Stop Montray Server
        if: always()
        run: sudo systemctl stop montray-server.service || true

  montray-ui:
    name: montray-ui E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build and headless-desktop dependencies
        run: |
          sudo apt-get update
          packages=(
            # Compiles native Rust dependencies such as ring.
            gcc
            # Provides fontconfig.pc and headers required by Slint's font stack.
            libfontconfig-dev
            # Provides the X11 keyboard library loaded by Slint/winit.
            libxkbcommon-x11-0
            # Runs the UI against a headless X server; also installs xauth.
            xvfb
            # Provides dbus-run-session for the Slint system tray.
            dbus-daemon
          )
          sudo apt-get install -y "${packages[@]}"

      - name: Build binaries and install Montray UI
        run: |
          make montray-server
          bash .github/build-montray-ui-linux.sh
          if readelf -lW ./bin/montray-server | grep '[[:space:]]INTERP[[:space:]]' >/dev/null; then
            echo "bin/montray-server is dynamically linked" >&2
            exit 1
          fi
          sudo make install-montray-ui

      - name: Set up and start Montray Server
        run: |
          sudo ./bin/montray-server setup

          test -x /usr/local/bin/montray-server
          cmp ./bin/montray-server /usr/local/bin/montray-server
          grep -Fq 'ExecStart="/usr/local/bin/montray-server"' /etc/systemd/system/montray-server.service
          sudo systemctl is-enabled --quiet montray-server.service
          sudo systemctl is-active --quiet montray-server.service

      - name: Configure Montray Server for the E2E incident
        run: |
          sudo patch --batch --forward /etc/montray-server.yml .github/e2e/montray-server.yml.patch
          sudo systemctl restart montray-server.service

      - name: Prepare isolated Montray UI home
        run: mkdir -p "${RUNNER_TEMP}/montray-ui-home"

      - name: Set up Montray UI
        env:
          HOME: ${{ runner.temp }}/montray-ui-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/montray-ui-home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/montray-ui-home/.local/share
        run: montray-ui setup

      - name: Verify incident reaches Montray UI
        env:
          HOME: ${{ runner.temp }}/montray-ui-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/montray-ui-home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/montray-ui-home/.local/share
        run: |
          watch_log="${RUNNER_TEMP}/montray-ui.log"
          setsid dbus-run-session -- xvfb-run -a montray-ui --start-hidden >"${watch_log}" 2>&1 &
          watch_pid=$!
          cleanup_watch() {
            kill -- "-${watch_pid}" 2>/dev/null || true
            wait "${watch_pid}" 2>/dev/null || true
          }
          trap cleanup_watch EXIT

          for _ in {1..120}; do
            if grep -Fq "UI and system tray initialized" "${watch_log}" &&
              grep -Fq "server local connected" "${watch_log}" &&
              grep -Fq "server local synchronized:" "${watch_log}" &&
              grep -Eq "server local (ongoing|added|updated) incident e2e\.exec_result \(error\): .*expected-e2e-incident" "${watch_log}"; then
              echo "Montray UI received the expected incident:"
              grep -E "server local (ongoing|added|updated) incident e2e\.exec_result" "${watch_log}"
              exit 0
            fi
            if ! kill -0 "${watch_pid}" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done

          echo "Timed out waiting for the expected Montray UI incident"
          echo "Montray UI log:"
          cat "${watch_log}"
          echo "Montray Server service log:"
          sudo journalctl --no-pager -u montray-server.service
          exit 1

      - name: Stop Montray Server
        if: always()
        run: sudo systemctl stop montray-server.service || true
