name: binaries

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref or commit to build
        type: string
        required: true
      artifact_prefix:
        description: Prefix for the uploaded workflow artifact names
        type: string
        required: true
      retention_days:
        description: Number of days to retain the workflow artifacts
        type: number
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  montray-server:
    name: montray-server (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine artifact version and architecture
        shell: bash
        run: |
          version="$(git describe --dirty --tags --always)"
          echo "ARTIFACT_VERSION=${version#v}" >> "$GITHUB_ENV"
          echo "ARTIFACT_ARCH=$(go env GOARCH)" >> "$GITHUB_ENV"

      - name: Build montray-server
        shell: bash
        run: make montray-server

      - name: Package montray-server
        run: |
          mkdir release
          tar -czf "release/montray-server-${ARTIFACT_VERSION}_linux_${ARTIFACT_ARCH}.tar.gz" -C bin montray-server
          cp bin/montray-server /tmp/montray-server-archive-binary

      - name: Install nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package montray-server for package managers
        env:
          PACKAGE_VERSION: ${{ env.ARTIFACT_VERSION }}
        run: |
          bash util/build_linux_packages.sh montray-server release

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.2

      - name: Generate SBOM and signatures
        run: |
          bash util/prepare_release_artifact.sh \
            "release/montray-server-${ARTIFACT_VERSION}_linux_${ARTIFACT_ARCH}.tar.gz" \
            /tmp/montray-server-archive-binary \
            "montray-server-${ARTIFACT_VERSION}_linux_${ARTIFACT_ARCH}"
          for package in release/*.deb release/*.rpm; do
            [[ -e "$package" ]] || continue
            package_name="$(basename "$package")"
            bash util/prepare_release_artifact.sh \
              "$package" \
              "$package" \
              "${package_name%.*}"
          done

      - name: Upload intermediary montray-server artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix }}-montray-server-linux
          path: release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  montray-ui-legacy:
    name: montray-ui-legacy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifact_os: linux
          - os: macos
            runner: macos-latest
            artifact_os: darwin
          - os: windows
            runner: windows-latest
            artifact_os: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install make
        if: matrix.os == 'windows'
        shell: pwsh
        run: choco install make --no-progress --yes

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Determine artifact version and architecture
        shell: bash
        run: |
          version="$(git describe --dirty --tags --always)"
          echo "ARTIFACT_VERSION=${version#v}" >> "$GITHUB_ENV"
          echo "ARTIFACT_ARCH=$(go env GOARCH)" >> "$GITHUB_ENV"

      - name: Build montray-ui-legacy
        shell: bash
        run: make montray-ui-legacy

      - name: Package Unix binary
        if: matrix.os != 'windows'
        run: |
          mkdir release
          tar -czf "release/montray-ui-legacy-${ARTIFACT_VERSION}_${{ matrix.artifact_os }}_${ARTIFACT_ARCH}.tar.gz" -C bin montray-ui-legacy

      - name: Package Windows binary
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          Compress-Archive -Path bin/montray-ui-legacy.exe -DestinationPath "release/montray-ui-legacy-${env:ARTIFACT_VERSION}_windows_${env:ARTIFACT_ARCH}.zip"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.2

      - name: Generate SBOM and signatures
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            archive="release/montray-ui-legacy-${ARTIFACT_VERSION}_windows_${ARTIFACT_ARCH}.zip"
            binary="bin/montray-ui-legacy.exe"
            signature_basename="montray-ui-legacy-${ARTIFACT_VERSION}_windows_${ARTIFACT_ARCH}.exe"
          else
            archive="release/montray-ui-legacy-${ARTIFACT_VERSION}_${{ matrix.artifact_os }}_${ARTIFACT_ARCH}.tar.gz"
            binary="bin/montray-ui-legacy"
            signature_basename="montray-ui-legacy-${ARTIFACT_VERSION}_${{ matrix.artifact_os }}_${ARTIFACT_ARCH}"
          fi
          bash util/prepare_release_artifact.sh "$archive" "$binary" "$signature_basename"

      - name: Upload intermediary montray-ui-legacy artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix }}-montray-ui-legacy-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  montray-ui:
    name: montray-ui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifact_os: linux
          - os: macos
            runner: macos-latest
            artifact_os: darwin
          - os: windows
            runner: windows-latest
            artifact_os: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install make
        if: matrix.os == 'windows'
        shell: pwsh
        run: choco install make --no-progress --yes

      - name: Determine artifact version and architecture
        shell: bash
        run: |
          version="$(git describe --dirty --tags --always)"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$host" in
            x86_64-*) arch=amd64 ;;
            aarch64-*) arch=arm64 ;;
            *)
              echo "Unsupported Rust host architecture: $host" >&2
              exit 1
              ;;
          esac
          echo "ARTIFACT_VERSION=${version#v}" >> "$GITHUB_ENV"
          echo "ARTIFACT_ARCH=$arch" >> "$GITHUB_ENV"

      - name: Set up Go for nFPM
        if: matrix.os == 'linux'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build montray-ui
        if: matrix.os != 'linux'
        shell: bash
        run: make montray-ui

      - name: Build montray-ui on Ubuntu 20.04
        if: matrix.os == 'linux'
        shell: bash
        run: bash .github/build-montray-ui-linux.sh

      - name: Package Unix binary
        if: matrix.os != 'windows'
        run: |
          mkdir release
          tar -czf "release/montray-ui-${ARTIFACT_VERSION}_${{ matrix.artifact_os }}_${ARTIFACT_ARCH}.tar.gz" -C bin montray-ui
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            cp bin/montray-ui /tmp/montray-ui-archive-binary
          fi

      - name: Install nFPM
        if: matrix.os == 'linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package montray-ui for package managers
        if: matrix.os == 'linux'
        env:
          PACKAGE_VERSION: ${{ env.ARTIFACT_VERSION }}
          MONTRAY_UI_LINUX_BUILDER: 1
        run: |
          bash util/build_linux_packages.sh montray-ui release

      - name: Package Windows binary
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          Compress-Archive -Path bin/montray-ui.exe -DestinationPath "release/montray-ui-${env:ARTIFACT_VERSION}_windows_${env:ARTIFACT_ARCH}.zip"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.2

      - name: Generate SBOM and signatures
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            archive="release/montray-ui-${ARTIFACT_VERSION}_windows_${ARTIFACT_ARCH}.zip"
            binary="bin/montray-ui.exe"
            signature_basename="montray-ui-${ARTIFACT_VERSION}_windows_${ARTIFACT_ARCH}.exe"
          else
            archive="release/montray-ui-${ARTIFACT_VERSION}_${{ matrix.artifact_os }}_${ARTIFACT_ARCH}.tar.gz"
            binary="bin/montray-ui"
            if [[ "${{ matrix.os }}" == "linux" ]]; then
              binary="/tmp/montray-ui-archive-binary"
            fi
            signature_basename="montray-ui-${ARTIFACT_VERSION}_${{ matrix.artifact_os }}_${ARTIFACT_ARCH}"
          fi
          bash util/prepare_release_artifact.sh "$archive" "$binary" "$signature_basename"
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            for package in release/*.deb release/*.rpm; do
              [[ -e "$package" ]] || continue
              package_name="$(basename "$package")"
              bash util/prepare_release_artifact.sh \
                "$package" \
                "$package" \
                "${package_name%.*}"
            done
          fi

      - name: Upload intermediary montray-ui artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix }}-montray-ui-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  assemble:
    name: Assemble
    needs:
      - montray-server
      - montray-ui-legacy
      - montray-ui
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}

      - name: Download binaries and SBOMs
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: ${{ inputs.artifact_prefix }}-*
          merge-multiple: true

      - name: Generate checksums
        run: bash util/prepare_release_checksums.sh release

      - name: Show release contents
        run: |
          {
            echo "### Release contents"
            echo
            echo '```text'
            find release -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test Linux packages
        run: bash .github/test-linux-packages.sh release

      - name: Upload combined release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_prefix }}-artifacts
          path: release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Remove intermediary workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        run: |
          for suffix in \
            montray-server-linux \
            montray-ui-legacy-linux \
            montray-ui-legacy-macos \
            montray-ui-legacy-windows \
            montray-ui-linux \
            montray-ui-macos \
            montray-ui-windows; do
            artifact_name="${ARTIFACT_PREFIX}-${suffix}"
            artifact_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq ".artifacts[] | select(.name == \"${artifact_name}\") | .id"
            )"
            if [[ -n "$artifact_id" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            fi
          done
